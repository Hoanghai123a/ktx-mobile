server {
  listen 4443 ssl;
  server_name localhost; # Hoặc IP của server của bạn

  # Certs path tương tự SmartNote
  ssl_certificate     /etc/nginx/certs/ktx.pem;
  ssl_certificate_key /etc/nginx/certs/ktx-key.pem;

  root /usr/share/nginx/html;
  index index.html;

  # Serve frontend (React/Vite SPA)
  location / {
    try_files $uri /index.html;
  }

  # Proxy API requests - cấu hình tương tự SmartNote
  location /api/ {
    proxy_pass http://localhost:5000/;   # Giả sử backend chạy ở cổng 5000
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }
}
